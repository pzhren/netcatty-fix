<svg viewBox="0 0 680 500" width="680" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Netcatty 自主模式：用户、监管 Agent、任务 Agent 三方位置与监管大脑机制</title>
  <desc>用户在顶层发起目标并可随时打断；监管 Agent 位于中间监督层，内部每轮执行汇总上下文、监督分析、决策派发；任务 Agent 在目标服务器执行；用户与任务 Agent 不直接对话，一切经监管 Agent 转达。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .ts{font:400 12px -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .th{font:500 14px -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .t11{font:400 11px -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  </style>

  <rect x="0" y="0" width="680" height="500" fill="#ffffff"/>

  <g>
    <rect x="250" y="44" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text class="th" x="340" y="64" text-anchor="middle" dominant-baseline="central" fill="#3C3489">用户（发起方）</text>
    <text class="ts" x="340" y="84" text-anchor="middle" dominant-baseline="central" fill="#534AB7">目标 · 执行计划 · 打断</text>
  </g>

  <g>
    <rect x="170" y="150" width="340" height="170" rx="20" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="th" x="190" y="174" dominant-baseline="central" fill="#0C447C">监管 Agent（中间监督层）</text>
    <rect x="190" y="190" width="88" height="48" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
    <text class="t11" x="234" y="207" text-anchor="middle" dominant-baseline="central" fill="#0C447C">汇总上下文</text>
    <text class="t11" x="234" y="225" text-anchor="middle" dominant-baseline="central" fill="#0C447C">轮次+结果</text>
    <rect x="296" y="190" width="88" height="48" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
    <text class="t11" x="340" y="207" text-anchor="middle" dominant-baseline="central" fill="#0C447C">监督分析</text>
    <text class="t11" x="340" y="225" text-anchor="middle" dominant-baseline="central" fill="#0C447C">对照任务目标</text>
    <rect x="402" y="190" width="88" height="48" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
    <text class="t11" x="446" y="207" text-anchor="middle" dominant-baseline="central" fill="#0C447C">决策派发</text>
    <text class="t11" x="446" y="225" text-anchor="middle" dominant-baseline="central" fill="#0C447C">分支决策</text>
    <path d="M280 214 L294 214" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M386 214 L400 214" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text class="t11" x="340" y="262" text-anchor="middle" dominant-baseline="central" fill="#0C447C">目标达成 → 结束（done） · 超时 → 先诊断，禁止原样重发</text>
    <text class="t11" x="340" y="284" text-anchor="middle" dominant-baseline="central" fill="#0C447C">正常推进 → 增量指令（≤300 字，不重述已生效计划）</text>
  </g>

  <g>
    <rect x="230" y="380" width="220" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text class="th" x="340" y="400" text-anchor="middle" dominant-baseline="central" fill="#27500A">任务 Agent（执行方）</text>
    <text class="ts" x="340" y="420" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">目标服务器 · terminal/SFTP</text>
  </g>

  <path d="M430 64 L560 64 L560 180 L514 180" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="552" y="120" text-anchor="end" dominant-baseline="central" fill="#185FA5">任务目标 · 执行计划 · 打断/插队</text>
  <path d="M510 240 L600 240 L600 88 L434 88" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="592" y="222" text-anchor="end" dominant-baseline="central" fill="#0F6E56">进度汇报 · 运行总结</text>

  <path d="M170 280 L110 280 L110 394 L226 394" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="104" y="340" text-anchor="end" dominant-baseline="central" fill="#3B6D11">增量指令</text>
  <path d="M230 428 L140 428 L140 300 L166 300" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="185" y="444" text-anchor="middle" dominant-baseline="central" fill="#185FA5">执行回复 · 轮次结果</text>

  <path d="M250 72 L60 72 L60 460 L260 460 L260 440" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M124 66 L136 78 M136 66 L124 78" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round"/>
  <text class="ts" x="130" y="54" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">不直接对话</text>

  <text class="ts" x="460" y="452" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">监管 ↔ 任务 对话只在目标服务器的 AI 侧边栏显示</text>
  <text class="ts" x="460" y="470" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">其他会话仅保留状态条与打断指令输入</text>
</svg>
